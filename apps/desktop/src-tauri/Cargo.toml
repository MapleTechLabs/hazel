[package]
name = "app"
version = "1.3.0"
description = "Hazel, the desktop app"
authors = ["Hazel"]
license-file = "../../../LICENSE"
repository = "https://github.com/MapleTechLabs/hazel"
edition = "2021"
rust-version = "1.95"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "3.0.0-alpha.6", features = [] }
tauri-plugin-log = "3.0.0-alpha.3"
tauri-plugin-deep-link = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"
tauri-plugin-store = "3.0.0-alpha.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-autostart = "3.0.0-alpha.3"
tauri-plugin-window-state = "3.0.0-alpha.2"
tauri-plugin-single-instance = { version = "3.0.0-alpha.3", features = ["deep-link"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# The auth API's native requests (`auth_http`); the updater's client and TLS setup, so nothing new to build.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# The webview runtime, per platform. Depending on a runtime crate is what selects it: tauri-build and
# the CLI (`@tauri-apps/cli-cef`) detect it per target. macOS draws with Chromium (CEF), which runs at
# the display's refresh rate where WKWebView paces the page at 60 fps; the CLI ships the CEF
# distribution and signs it for Chromium's JIT. Windows and Linux keep the system webview.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-runtime-wry = "3.0.0-alpha.6"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-runtime-cef = "3.0.0-alpha.7"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDictionary", "NSString", "NSUserDefaults", "NSValue"] }
