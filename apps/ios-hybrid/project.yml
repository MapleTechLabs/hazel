name: Hazel
options:
    bundleIdPrefix: sh.hazel
    deploymentTarget:
        iOS: "26.0"
# HazelUI (C0): the one Swift package for the tree, wire, runtime and primitives.
packages:
    HazelUI:
        path: HazelUI
settings:
    base:
        SWIFT_VERSION: "6.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
targets:
    Hazel:
        type: application
        platform: iOS
        dependencies:
            - package: HazelUI
        sources:
            - path: Hazel
            - path: Shared
            # The script (`bun run build:hazel`), copied as a folder.
            - path: build/script
              type: folder
              buildPhase: resources
            # The web build for the fallback (`bun run build:web`), as the hybrid serves it.
            - path: build/web
              type: folder
              buildPhase: resources
            # The web's own icons (`scripts/export-icons.ts`) and Inter (`scripts/fonts.py`).
            - path: build/icons/Icons.xcassets
            - path: build/fonts
              type: folder
              buildPhase: resources
        info:
            path: Hazel/Info.plist
            properties:
                CFBundleDisplayName: Hazel
                CFBundleShortVersionString: $(MARKETING_VERSION)
                CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                ITSAppUsesNonExemptEncryption: false
                HazelPageOrigin: $(HAZEL_PAGE_ORIGIN)
                HazelApiUrl: $(HAZEL_API_URL)
                # Deep links: `hazelchat:///<org>/chat/<channel>` opens that page (`AppLinks`).
                CFBundleURLTypes:
                    - CFBundleURLName: sh.hazel.native.links
                      CFBundleURLSchemes:
                          - hazelchat
                NSAppTransportSecurity:
                    NSAllowsLocalNetworking: true
                UILaunchScreen:
                    UIColorName: LaunchBackground
                CADisableMinimumFrameDurationOnPhone: true
                UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: sh.hazel.native
                HAZEL_PAGE_ORIGIN: "https://app.hazel.sh"
                HAZEL_API_URL: "https://api.hazel.sh"
                MARKETING_VERSION: "0.1.0"
                CURRENT_PROJECT_VERSION: "1"
                ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
                TARGETED_DEVICE_FAMILY: "1"
                GENERATE_INFOPLIST_FILE: YES
    # Effect UI on a native host (spike, `effect-ui/`): the script in JavaScriptCore, SwiftUI draws.
    EffectUiSpike:
        type: application
        platform: iOS
        dependencies:
            - package: HazelUI
        sources:
            - path: EffectUiSpike
            # The script (`bun run build:effect-ui`), copied as a folder.
            - path: build/effect-ui
              type: folder
              buildPhase: resources
            # The conformance fixtures (`packages/ui/src/conformance/fixtures`), read by the gallery screen.
            - path: ../../packages/ui/src/conformance/fixtures
              type: folder
              buildPhase: resources
            # The web's own icons (`scripts/export-icons.ts`) and Inter (`scripts/fonts.py`).
            - path: build/icons/Icons.xcassets
            - path: build/fonts
              type: folder
              buildPhase: resources
        info:
            path: EffectUiSpike/Info.plist
            properties:
                CFBundleDisplayName: Effect UI
                CFBundleShortVersionString: $(MARKETING_VERSION)
                CFBundleVersion: $(CURRENT_PROJECT_VERSION)
                UILaunchScreen: {}
                UIApplicationSceneManifest:
                    UIApplicationSupportsMultipleScenes: false
                UISupportedInterfaceOrientations:
                    - UIInterfaceOrientationPortrait
        settings:
            base:
                PRODUCT_BUNDLE_IDENTIFIER: sh.hazel.effect-ui-spike
                # No app icon: the catalog holds only the web's icons.
                ASSETCATALOG_COMPILER_APPICON_NAME: ""
                MARKETING_VERSION: "0.1.0"
                CURRENT_PROJECT_VERSION: "1"
                TARGETED_DEVICE_FAMILY: "1"
                GENERATE_INFOPLIST_FILE: YES
