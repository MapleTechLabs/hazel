<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<link rel="icon" href="/icon.svg" />
		<meta name="theme-color" content="#000000" />
		<meta name="description" content="Slack alternative for modern teams." />
		<title>Hazel</title>
		<script>
			// Runs before the app's script has loaded. It starts the sync token exchange, which
			// `readAccessToken` takes over (`src/core/lib/access-token.ts`), and beside it wakes the
			// Durable Objects this page opens (`POST /sync/warm`), so a cold one starts in the
			// meantime: the user's own, the remembered user's organizations, the URL's channel.
			// Not on public routes, nor in the desktop app (its session is a bearer, not this cookie;
			// `src/core/db/warm.ts` asks there).
			;(function () {
				var path = location.pathname
				if ("__TAURI_INTERNALS__" in window) return
				if (/^\/(sign-in|sign-up|auth|join|invite)(\/|$)/.test(path)) return
				var api = "%VITE_BACKEND_URL%"
				if (api === "" || api.charAt(0) === "%") api = "http://localhost:3003"
				window.__hazelEarlyToken = {
					response: fetch(api + "/auth/token", {
						method: "POST",
						credentials: "include",
						headers: { "x-effect-auth-csrf": "1" },
					}).catch(function () {
						return null
					}),
					startedAtMs: Date.now(),
				}
				var query = []
				var channel = /^\/[^/]+\/chat\/([0-9a-f-]{36})(\/|$)/i.exec(path)
				if (channel) query.push("channel=" + channel[1])
				try {
					var user = JSON.parse(localStorage.getItem("hazel:last-user") || "null")
					var orgs = user
						? JSON.parse(localStorage.getItem("hazel:org-sources:" + user.id) || "[]")
						: []
					for (var i = 0; i < orgs.length && i < 8; i++) {
						if (/^org:[0-9a-f-]{36}$/i.test(orgs[i])) query.push("org=" + orgs[i].slice(4))
					}
				} catch (error) {}
				// The session cookie alone, with no header or body: a request that needs no preflight.
				window.__hazelEarlyWarm = true
				fetch(api + "/sync/warm" + (query.length ? "?" + query.join("&") : ""), {
					method: "POST",
					credentials: "include",
				}).catch(function () {})
			})()
		</script>
	</head>
	<body class="bg-bg text-fg">
		<div id="app"></div>
		<script type="module" src="/src/entry.ts"></script>
	</body>
</html>
