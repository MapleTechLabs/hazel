[package]
name = "hazel-ios"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
hazel-native = { path = ".." }
# The same revision as `hazel-native`'s (`../Cargo.toml`).
rune = { git = "https://github.com/Makisuo/rune", rev = "b6cc638175ae39732db079a9fd54bda68a0f181c" }
serde_json = "1"

# The hidden web view the runtime's worker runs in (`src/bridge.rs`).
[target.'cfg(target_os = "ios")'.dependencies]
# Sign-in through the system's web authentication sheet (`src/sign_in.rs`).
objc2-authentication-services = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
objc2-web-kit = "0.3"
