[package]
name = "hazel-ios"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
hazel-native = { path = ".." }
# The same revision as `hazel-native`'s (`../Cargo.toml`).
rune = { git = "https://github.com/Makisuo/rune", rev = "037014a3d791e057466c4401ccb7fb3841219000" }
serde_json = "1"

# The hidden web view the runtime's worker runs in (`src/bridge.rs`).
[target.'cfg(target_os = "ios")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-ui-kit = "0.3"
objc2-web-kit = "0.3"
