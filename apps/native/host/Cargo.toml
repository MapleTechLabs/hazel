[package]
name = "hazel-native"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# Rune is pre-release: pin a revision. This is anomalyco/rune bca4713 plus grid tracks
# (El::grid_columns, grid_row_start), Tx::focus and Tx::drawn_rects, on Makisuo/rune's `hazel-grid` branch until they land upstream.
rune = { git = "https://github.com/Makisuo/rune", rev = "dbd7526f80e47e4e91d3b8f3bd4d1b73e56101cb" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

[profile.release]
debug = false
