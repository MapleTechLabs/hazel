[workspace]
members = [".", "ios"]

[package]
name = "hazel-native"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# Rune is pre-release: pin a revision. This is anomalyco/rune bca4713 plus grid tracks
# (El::grid_columns, grid_row_start), Tx::focus, Tx::drawn_rects, set_default_transition,
# El::focusable_by_script and El::clip_fade_linear_frac (Makisuo/rune's `hazel-grid` branch), plus
# iOS's full-screen window, safe area and motion frames (`hazel-ios`), plus a soft keyboard's
# return as Enter, iOS's display link and El::pin_insets (`hazel-ios-followups`), plus a
# long-press opening an element's context menu (`hazel-long-press`), plus Tx::scroll_by (`hazel-scroll-by`),
# until they land upstream.
rune = { git = "https://github.com/Makisuo/rune", rev = "c3536c225a3a7e0bb8af798e011ef56fd4a8bb92", features = [
	"native-file-dialog",
] }
rune-fx = { git = "https://github.com/Makisuo/rune", rev = "c3536c225a3a7e0bb8af798e011ef56fd4a8bb92" }
base64 = "0.22"
# Decodes a picture and its mask picture to composite them (Rune's own decoder, same features).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The sign-in vault in the OS keychain (Keychain, Credential Manager, Secret Service), as the
# Tauri app keeps its own (apps/desktop).
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Verifies an update's signature as the Tauri updater does (apps/desktop), with the same key.
minisign-verify = "0.2"
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

# Downloads off Apple platforms (`src/fetch.rs`).
[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

# Downloads through the system's URL loading on macOS and iOS (`src/fetch.rs`).
[target.'cfg(target_vendor = "apple")'.dependencies]
block2 = "0.6"
objc2-foundation = "0.3"

# The web views HTML render frames show their pages in (`src/frames.rs`).
objc2 = "0.6"
objc2-web-kit = "0.3"
objc2-quartz-core = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
# System notifications (`src/notify.rs`): the web app's on macOS, the permission for pushes on iOS.
objc2-user-notifications = { version = "0.3", default-features = false, features = [
	"std",
	"UNUserNotificationCenter",
	"UNNotificationContent",
	"UNNotificationRequest",
	"UNNotificationSettings",
	"UNNotificationTrigger",
	"block2",
] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2-ui-kit = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3"

[profile.release]
debug = false

