[package]
name = "hazel-native"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# Rune is pre-release: pin a revision. This is anomalyco/rune bca4713 plus grid tracks
# (El::grid_columns, grid_row_start), Tx::focus, Tx::drawn_rects, set_default_transition and
# El::focusable_by_script, on Makisuo/rune's `hazel-grid` branch until they land upstream.
rune = { git = "https://github.com/Makisuo/rune", rev = "1f7dcb2ca14381c45056abdf11876d51e49213af", features = ["native-file-dialog"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The sign-in vault in the macOS keychain, as the Tauri app keeps its own (apps/desktop).
keyring = { version = "3", features = ["apple-native"] }
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

[profile.release]
debug = false
