[package]
name = "hazel-native"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
# Rune is pre-release: pin a revision. This is anomalyco/rune bca4713 plus grid tracks
# (El::grid_columns), on Makisuo/rune's `hazel-grid` branch until that lands upstream.
rune = { git = "https://github.com/Makisuo/rune", rev = "df69fd4e301835aa4f82ba48e4ac02137ad09dd7" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = { version = "~30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl"] }

[profile.release]
debug = false
