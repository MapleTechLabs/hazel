name: deploy setup
description: >-
    Toolchain and dependencies for an alchemy deploy job. Secrets come from the job's GitHub
    Environment (`production` or `pr-preview`) as env vars; alchemy reads them through Config
    when it plans the stack (see apps/*/alchemy.run.ts and apps/backend/src/worker/env.ts).

runs:
    using: composite
    steps:
        - name: Setup Bun
          uses: oven-sh/setup-bun@v1
          with:
              bun-version: 1.3.14

        - name: Cache dependencies
          uses: actions/cache@v4
          with:
              path: |
                  ~/.bun/install/cache
                  node_modules
                  */node_modules
              key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
              restore-keys: |
                  ${{ runner.os }}-bun-

        - name: Install dependencies
          shell: bash
          run: bun install --frozen-lockfile
