name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                      */node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Only the builds: the typecheck job's `bun run typecheck` already runs `turbo build typecheck`.
            # Running every tsc next to every build here kept losing the runner mid-step.
            - name: Build
              run: bunx turbo build
              env:
                  VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
                  VITE_R2_PUBLIC_URL: ${{ vars.VITE_R2_PUBLIC_URL }}
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                      */node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            # Two packages at a time: the large tsc runs (web, backend, native) side by side outgrow
            # the hosted runner's memory, which then kills the job (exit 137, "operation canceled").
            - name: Type check
              run: bun run typecheck --concurrency=2

            - name: Type check the alchemy stack
              run: bun run alchemy:typecheck

            - name: Format
              run: bun run format:check

            - name: Lint
              run: bun run lint

            - name: Unused files, dependencies and exports
              run: bun run knip

    test:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Cache dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.bun/install/cache
                      node_modules
                      */node_modules
                  key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Run sync regression suite
              run: CHAT_SYNC_TEST_DIAGNOSTICS_DIR=apps/backend/.artifacts/chat-sync bun run --cwd apps/backend test:sync

            - name: Run tests
              run: bun run test:once --coverage.enabled true
              env:
                  VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}

            - name: Upload sync diagnostics
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: chat-sync-diagnostics-${{ github.run_id }}
                  path: apps/backend/.artifacts/chat-sync
                  if-no-files-found: ignore

            - name: "Report Coverage"
              if: always()
              uses: davelosert/vitest-coverage-report-action@v2
