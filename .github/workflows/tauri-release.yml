name: Tauri Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            build_only:
                description: "Build every platform without creating a release (to check a branch)"
                type: boolean
                default: false

jobs:
    build:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: macos-latest
                      args: "--target aarch64-apple-darwin"
                    - platform: macos-latest
                      args: "--target x86_64-apple-darwin"
                    - platform: ubuntu-22.04
                      args: ""
                    - platform: windows-latest
                      args: ""

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: latest

            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: "./apps/desktop/src-tauri -> target"

            - name: Install dependencies (Ubuntu)
              if: matrix.platform == 'ubuntu-22.04'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-4-dev libappindicator3-dev librsvg2-dev patchelf

            # The Mac app runs on Chromium (CEF): building its bindings needs cmake and ninja, and the
            # CLI ships the CEF distribution (about 1 GB unpacked), cached between runs.
            - name: Install CEF build tools (macOS)
              if: matrix.platform == 'macos-latest'
              run: brew install cmake ninja

            - name: CEF distribution cache (macOS)
              if: matrix.platform == 'macos-latest'
              uses: actions/cache@v4
              with:
                  path: ~/Library/Caches/tauri-cef
                  key: tauri-cef-${{ matrix.args }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}

            - name: Install frontend dependencies
              run: bun install --frozen-lockfile

            - name: Build Tauri App
              uses: tauri-apps/tauri-action@v0
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  VITE_BACKEND_URL: ${{ vars.VITE_BACKEND_URL }}
                  VITE_R2_PUBLIC_URL: ${{ vars.VITE_R2_PUBLIC_URL }}
              with:
                  projectPath: apps/desktop
                  # The repo's own CLI (`@tauri-apps/cli-cef`, Tauri 3): without this tauri-action
                  # installs `@tauri-apps/cli@v2`, which neither builds Tauri 3 nor ships CEF.
                  tauriScript: bun run tauri
                  # No tag in a build-only run: tauri-action then builds without touching a release.
                  # (`!build_only && tag || ''`, not `build_only && '' || tag`: an empty string is
                  # falsy in an expression, so the latter always gives the tag.)
                  tagName: ${{ !inputs.build_only && 'v__VERSION__' || '' }}
                  releaseName: "Hazel v__VERSION__"
                  releaseBody: "See the assets to download this version and install."
                  releaseDraft: true
                  prerelease: false
                  args: ${{ matrix.args }}
