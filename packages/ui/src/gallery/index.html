<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Parity gallery</title>
		<style>
			body { margin: 0; font: 13px system-ui, sans-serif; }
			header { display: flex; gap: 16px; padding: 8px 16px; align-items: center; }
			main { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 40px); }
			iframe { width: 100%; height: 100%; border: 0; border-left: 1px solid #8884; }
		</style>
	</head>
	<body>
		<header>
			<strong>Hazel UI parity</strong>
			<span>left: today's Foldkit kit; right: data-hz DOM on the generated tokens.css</span>
			<a href="?theme=light">light</a><a href="?theme=dark">dark</a>
		</header>
		<main>
			<iframe id="kit"></iframe>
			<iframe id="hazel"></iframe>
		</main>
		<script>
			const theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light"
			document.getElementById("kit").src = `./kit.html?theme=${theme}`
			document.getElementById("hazel").src = `./hazel.html?theme=${theme}`
		</script>
	</body>
</html>
