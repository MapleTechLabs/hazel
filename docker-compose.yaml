# Local services for `bun run alchemy:dev`. The api Worker, its Durable Objects and the directory D1
# run inside alchemy dev; only S3 (uploads) needs a stand-in.
name: hazel
services:
    # MinIO - S3-compatible object storage
    minio:
        image: minio/minio:latest
        ports:
            - "9000:9000" # S3 API
            - "9001:9001" # Console UI
        environment:
            MINIO_ROOT_USER: minioadmin
            MINIO_ROOT_PASSWORD: minioadmin
        command: server /data --console-address ":9001"
        volumes:
            - minio_data:/data
        healthcheck:
            test: ["CMD", "mc", "ready", "local"]
            interval: 10s
            timeout: 5s
            retries: 5
        restart: always

    # MinIO bucket initialization
    minio-init:
        image: minio/mc:latest
        depends_on:
            minio:
                condition: service_healthy
        entrypoint: >
            /bin/sh -c "
            mc alias set local http://minio:9000 minioadmin minioadmin;
            mc mb local/hazel --ignore-existing;
            mc anonymous set download local/hazel;
            exit 0;
            "

volumes:
    minio_data:
        driver: local
